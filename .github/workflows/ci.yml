name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install aiohttp pytest
      - name: Unit tests
        run: pytest -q tests
      - name: Benchmark smoke test against mock server
        run: |
          python tests/mock_server.py &
          sleep 2
          python scripts/bench_serving.py --model mock --concurrency 1 4 --rounds 2 --out /tmp/smoke
      - name: Shell syntax check
        run: bash -n scripts/serve.sh scripts/check_gpu.sh scripts/run_bench.sh
